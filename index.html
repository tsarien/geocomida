<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geocomida · La geografía que te comes</title>
  <meta name="description" content="Mira los videos de Geocomida: historias de los alimentos que viajan por el mundo.">
  <meta name="theme-color" content="#FFF8E7">

  <!-- Vista previa al compartir el enlace -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Geocomida · La geografía que te comes">
  <meta property="og:description" content="La papa tuvo un rey y el banano tiene mucho que contar. ¡Mira los videos!">
  <meta property="og:url" content="https://geocomida.vercel.app/">
  <meta property="og:image" content="https://geocomida.vercel.app/assets/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Garabatos decorativos de fondo -->
  <div class="decor" aria-hidden="true">
    <svg class="d d-star" viewBox="0 0 40 40"><path d="M20 3 L24 15 L37 15 L27 23 L31 36 L20 28 L9 36 L13 23 L3 15 L16 15 Z"/></svg>
    <svg class="d d-squiggle" viewBox="0 0 80 24"><path d="M3 12 C 13 2, 19 22, 29 12 S 45 2, 55 12 S 71 22, 77 12"/></svg>
    <svg class="d d-sparkle" viewBox="0 0 40 40"><path d="M20 4 V14 M20 26 V36 M4 20 H14 M26 20 H36"/></svg>
    <svg class="d d-circle" viewBox="0 0 40 40"><path d="M21 5 C 33 5, 37 15, 35 23 C 33 33, 22 37, 14 34 C 5 30, 3 19, 8 12 C 11 7, 17 4, 24 6"/></svg>
    <svg class="d d-heart" viewBox="0 0 40 40"><path d="M20 34 C 8 26, 3 18, 6 11 C 9 5, 17 5, 20 12 C 23 5, 31 5, 34 11 C 37 18, 32 26, 20 34 Z"/></svg>
    <svg class="d d-zigzag" viewBox="0 0 70 20"><path d="M3 15 L13 5 L23 15 L33 5 L43 15 L53 5 L63 15"/></svg>
  </div>

  <main class="page">

    <header class="hero">
      <img class="logo" src="assets/logo.webp" width="640" height="640"
           alt="Logo de Geocomida: un planeta rodeado de café, trigo, banano, aguacate, petróleo y un barco de carga">
      <p class="tagline">¡La geografía que te comes!</p>
      <p class="intro">Cada alimento tiene un viaje y una historia. Elige un video y descúbrela.</p>
    </header>

    <section class="videos" aria-labelledby="videos-title">
      <h1 id="videos-title" class="section-title">
        Elige un video
        <svg class="arrow" viewBox="0 0 60 60" aria-hidden="true">
          <path d="M8 10 C 30 8, 46 20, 44 46"/>
          <path d="M34 38 L44 48 L52 36"/>
        </svg>
      </h1>

      <!-- Video 1 -->
      <a class="card card--papa"
         href="https://youtu.be/ZtIXCT2Z2_g"
         target="_blank" rel="noopener">
        <span class="badge">1</span>

        <span class="sticker" aria-hidden="true">
          <img src="assets/doodles/papa-rey.webp" alt="" width="120" height="120">
          <svg viewBox="0 0 100 100">
            <path class="fill-papa" d="M20 60 C 16 42, 36 32, 54 35 C 74 37, 86 50, 81 66 C 76 82, 52 88, 34 82 C 24 78, 22 70, 20 60 Z"/>
            <path class="fill-crown" d="M35 38 L 32 16 L 43 26 L 51 11 L 59 26 L 70 16 L 68 39 Z"/>
            <circle class="fill-ink" cx="44" cy="57" r="2.8"/>
            <circle class="fill-ink" cx="60" cy="57" r="2.8"/>
            <path class="fill-none" d="M45 66 Q 52 72 59 66"/>
            <circle class="fill-spot" cx="30" cy="66" r="2"/>
            <circle class="fill-spot" cx="72" cy="72" r="2"/>
            <circle class="fill-spot" cx="74" cy="52" r="1.6"/>
          </svg>
        </span>

        <span class="thumb">
          <img src="https://i.ytimg.com/vi/ZtIXCT2Z2_g/hqdefault.jpg"
               alt="" loading="lazy" width="480" height="360">
          <span class="play" aria-hidden="true">
            <svg viewBox="0 0 40 40"><path d="M15 11 L30 20 L15 29 Z"/></svg>
          </span>
        </span>

        <span class="card-body">
          <span class="kicker">Geocomida</span>
          <span class="card-title">¿Sabías que la papa tuvo un rey?</span>
          <span class="cta">Ver en YouTube <span aria-hidden="true">→</span></span>
        </span>
      </a>

      <!-- Video 2 -->
      <a class="card card--banana"
         href="https://youtu.be/JtkVnwTT1c8"
         target="_blank" rel="noopener">
        <span class="badge">2</span>

        <span class="sticker" aria-hidden="true">
          <img src="assets/doodles/banano.webp" alt="" width="120" height="120">
          <svg viewBox="0 0 100 100">
            <path class="fill-banana" d="M16 30 C 12 70, 46 94, 88 78 C 94 75, 92 64, 85 66 C 60 72, 42 58, 40 30 Z"/>
            <path class="fill-none" d="M26 44 C 30 64, 48 78, 70 79"/>
            <path class="fill-stem" d="M21 31 L 21 17 L 33 17 L 34 31 Z"/>
            <circle class="fill-ink" cx="50" cy="62" r="2.8"/>
            <circle class="fill-ink" cx="63" cy="66" r="2.8"/>
            <path class="fill-none" d="M52 71 Q 57 75 62 73"/>
          </svg>
        </span>

        <span class="thumb">
          <img src="https://i.ytimg.com/vi/JtkVnwTT1c8/hqdefault.jpg"
               alt="" loading="lazy" width="480" height="360">
          <span class="play" aria-hidden="true">
            <svg viewBox="0 0 40 40"><path d="M15 11 L30 20 L15 29 Z"/></svg>
          </span>
        </span>

        <span class="card-body">
          <span class="kicker">Geocomida</span>
          <span class="card-title">El banano tiene mucho que contar</span>
          <span class="cta">Ver en YouTube <span aria-hidden="true">→</span></span>
        </span>
      </a>
    </section>

    <footer class="footer">
      <button class="share" type="button" id="share-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="M8.6 13.5 L15.4 17.5 M15.4 6.5 L8.6 10.5"/>
        </svg>
        Compartir esta página
      </button>
      <p class="small">Hecho con hambre de saber · Geocomida <span id="year"></span></p>
    </footer>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js" defer></script>
</body>
</html>
